# ============================================================
# 本地配置模板：首次运行请复制本文件为 application.yml
#   （位于 cms-backend/src/main/resources/ 下）
# 并填入你本地的数据库密码 / 邮箱授权码 / AI Key。
# 敏感项全部支持环境变量注入，优先级高于本文件默认值。
# ============================================================

server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: cms-backend

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/cms?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:请填入你的MySQL密码}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

  mail:
    host: smtp.example.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8

  # Spring AI：DashScope 主选（配 DASHSCOPE_API_KEY 自动生效），Ollama 兜底
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:3b
          temperature: 0.7

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 双令牌
jwt:
  secret: ${JWT_SECRET:please-change-me-in-production}
  access-token-expiration: 7200000      # AccessToken 2小时
  refresh-token-expiration: 604800000   # RefreshToken 7天

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: cms

# 接口限流
rate-limit:
  login-per-minute: 10
  ai-per-minute: 5
  comment-per-minute: 20

# 定时任务
job:
  view-count-flush-interval-ms: 300000

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /doc.html
