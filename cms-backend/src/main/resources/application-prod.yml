# 生产环境：全部敏感配置走环境变量注入（Docker，文档 9.2）
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/cms?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

logging:
  level:
    com.cms: info
